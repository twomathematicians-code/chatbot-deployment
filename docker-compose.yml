services:
  chatbot-api:
    build: .
    ports: ["8000:8000"]
    environment:
      VECTOR_STORE_PERSIST: /app/chroma_data
      TELEGRAM_WEBHOOK_SECRET: changeme
      WHATSAPP_VERIFY_TOKEN: changeme
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped
volumes:
  chroma_data:
