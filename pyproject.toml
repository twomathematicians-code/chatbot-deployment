[tool.poetry]
name = "ml-chatbot-deployment"
version = "1.0.0"
description = "Production chatbot deployment API: RAG-based conversational AI, Telegram/WhatsApp bot integration, intent classification, and multi-turn dialogue."
authors = ["Mahesh Pravinsinh Solanki <maheshsinh1910@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
scikit-learn = "^1.5.0"
xgboost = "^2.0.3"
pandas = "^2.2.0"
numpy = "^1.26.0"
mlflow = "^2.14.0"
pyyaml = "^6.1.0"
httpx = "^0.27.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
chromadb = "^0.5.0"
tiktoken = "^0.7.0"
[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.4.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
