[tool.poetry]
name = "chatbot-deployment"
version = "1.0.0"
description = "Chatbot deployment platform: RAG-based conversational AI, LangChain integration, ChromaDB vector store, Telegram and WhatsApp webhook connectors."
authors = ["Mahesh Solanki"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
langchain = "^0.2"
langchain-community = "^0.2"
chromadb = "^0.5"
tiktoken = "^0.7"
httpx = "^0.27"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
