stages: [lint, test, build]
lint:
  image: python:3.11-slim
  script: pip install ruff && ruff check src/
  only: [main, merge_requests]
test:
  image: python:3.11-slim
  script: pip install poetry && poetry install --with dev && poetry run pytest tests/ -v
  only: [main, merge_requests]
build:
  image: docker:24-dind
  services: [docker:24-dind]
  script: docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA . && docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  only: [main]
